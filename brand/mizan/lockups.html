<!doctype html><meta charset=utf-8><style>
@font-face{font-family:Hanken;src:url(f/HankenGrotesk.ttf);font-weight:100 900}@font-face{font-family:Beiruti;src:url(f/Beiruti.ttf);font-weight:200 900}
body{margin:0;font-family:Hanken;background:#FAF9F5}

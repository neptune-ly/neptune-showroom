<!doctype html>
<html lang="en" dir="ltr" data-odyssey-mode="light" data-look="telco">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Polaris module demo · Neptune</title>
<meta name="description" content="Standalone page for the Neptune Polaris on-device onboarding module. Demonstration, simulated data.">
<link rel="stylesheet" href="../../hub/assets/odyssey.css">
<link rel="stylesheet" href="../looks/looks.css">
<link rel="stylesheet" href="../looks/looks-picker.css">
<style>
@font-face{font-family:"Hanken Grotesk";src:url(../../hub/assets/fonts/HankenGrotesk.ttf);font-weight:100 900;font-display:swap}
@font-face{font-family:"Baloo 2";src:url(../../hub/assets/fonts/Baloo2.ttf);font-weight:400 800;font-display:swap}
@font-face{font-family:"Beiruti";src:url(../../hub/assets/fonts/Beiruti.ttf);font-weight:200 900;font-display:swap}
html,body{margin:0;height:100%}
body{font-family:"Hanken Grotesk",system-ui,sans-serif;background:var(--look-canvas);color:var(--look-ink);display:flex;flex-direction:column}
[dir=rtl] body,[dir=rtl] .po{font-family:"Beiruti","Hanken Grotesk",sans-serif}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 16px;border-bottom:1px solid var(--look-line)}
.bar h1{font:700 17px var(--look-font-display);margin:0 12px 0 0}
.seg{display:inline-flex;border:1.5px solid var(--look-line);border-radius:12px;overflow:hidden}
.seg button{border:0;background:transparent;padding:8px 12px;font:600 13px inherit;color:inherit;cursor:pointer;min-height:40px}
.seg button[aria-pressed=true]{background:var(--look-brand);color:var(--look-on-brand)}
.main{flex:1;min-height:0;display:grid;place-items:center;padding:12px}
.phone{width:min(100%,390px);height:min(100%,780px);border-radius:34px;overflow:hidden;border:1px solid var(--look-line);background:var(--look-surface);box-shadow:0 30px 60px -30px rgba(0,0,0,.4)}
@media (max-width:520px){.main{padding:0}.phone{width:100%;height:100%;border-radius:0;border:0}.bar{display:none}}
.log{display:none;position:fixed;bottom:6px;inset-inline-start:8px;font:11px monospace;opacity:.6;max-width:50vw;white-space:pre-wrap}
</style>
</head>
<body>
<div class="bar"><h1>Polaris module</h1>
<div class="seg" id="lang" role="group" aria-label="Language"><button data-v="en" aria-pressed="true">EN</button><button data-v="fr" aria-pressed="false">FR</button><button data-v="ar" aria-pressed="false">AR</button></div>
<div class="seg" id="mode" role="group" aria-label="Theme"><button data-v="light" aria-pressed="true">Light</button><button data-v="dark" aria-pressed="false">Dark</button></div>
<div id="looks"></div></div>
<div class="main"><div class="phone" id="host"></div></div>
<pre class="log" id="log"></pre>
<script src="../looks/looks.js"></script>
<script type="module">
import { mount } from './polaris.js';
const q = new URLSearchParams(location.search), root = document.documentElement;
const lang = q.get('lang') || 'en', theme = q.get('theme') || 'light';
const setLang = l => { root.lang = l; root.dir = l === 'ar' ? 'rtl' : 'ltr'; document.querySelectorAll('#lang button').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === l)); window.polaris && window.polaris.setLang(l); };
const setTheme = m => { root.dataset.odysseyMode = m; document.querySelectorAll('#mode button').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === m)); };
document.getElementById('lang').onclick = e => { const b = e.target.closest('button'); if (b) setLang(b.dataset.v); };
document.getElementById('mode').onclick = e => { const b = e.target.closest('button'); if (b) setTheme(b.dataset.v); };
Looks.mount(document.getElementById('looks'), { label: 'Look' });
const opts = { lang, camera: q.get('camera') || 'auto' };
if (q.get('challenges')) opts.challengeList = q.get('challenges').split(',');
if (q.get('timeout')) opts.livenessTimeoutMs = +q.get('timeout');
if (q.get('autocapture') === '0') opts.autoCapture = false;
if (q.get('look')) Looks.set(q.get('look'));
setTheme(theme); root.lang = lang; root.dir = lang === 'ar' ? 'rtl' : 'ltr';
const polaris = window.polaris = mount(document.getElementById('host'), opts);
const log = document.getElementById('log'); if (q.get('debug')) log.style.display = 'block';
polaris.on('step', e => { log.textContent = 'step: ' + e.id + '\n' + log.textContent.split('\n').slice(0, 5).join('\n'); document.title = 'Polaris · ' + e.id; });
polaris.on('result', e => { window.lastResult = e; log.textContent = 'result: ' + e.decision + ' (' + e.reason + ')\n' + log.textContent; });
</script>
</body></html>

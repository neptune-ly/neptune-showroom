<section id="how" class="sec how">
  <div class="head"><h2 data-i18n="how_t"></h2><p data-i18n="how_s"></p></div>
  <div class="flow" id="flow">
    <div class="fl-node" data-n="0"><span class="ic" style="--i:url(../assets/icons/user.svg)"></span><b data-i18n="n_cust"></b><small data-i18n="n_cust_s"></small></div>
    <div class="fl-link" data-l="0"><i data-i18n="l_12"></i><span class="bar"><span class="pk"></span></span></div>
    <div class="fl-node" data-n="1"><span class="ic" style="--i:url(../assets/icons/shopping-bag.svg)"></span><b data-i18n="n_mer"></b><small data-i18n="n_mer_s"></small></div>
    <div class="fl-link" data-l="1"><i data-i18n="l_23"></i><span class="bar"><span class="pk"></span></span></div>
    <div class="fl-node fin" data-n="2"><span class="ic" style="--i:url(../assets/icons/accounts.svg)"></span><b data-i18n="n_fin"></b><small data-i18n="n_fin_s"></small></div>
    <div class="fl-link mip" data-l="2"><i data-i18n="l_34"></i><span class="bar"><span class="pk"></span><span class="pk p2"></span></span></div>
    <div class="fl-node mb" data-n="3"><span class="ic" style="--i:url(../assets/icons/security-shield.svg)"></span><b data-i18n="n_mb"></b><small data-i18n="n_mb_s"></small></div>
    <div class="rail" id="rail"><span class="ic" style="--i:url(../assets/icons/coins.svg)"></span><span data-i18n="rail"></span><span class="bar"><span class="pk coin"></span></span></div>
  </div>
  <div class="legend"><span><i class="sw mipc"></i><span data-i18n="mip_legend"></span></span><span><i class="sw coinc"></i><span data-i18n="money_legend"></span></span></div>
  <div class="steps" id="steps" role="tablist"></div>
  <div class="step-panel" id="stepPanel" aria-live="polite"></div>
  <div class="ctrls"><button class="btn outline sm" id="prev" data-i18n="prev"></button><button class="btn tonal sm" id="play" data-i18n="pause"></button><button class="btn outline sm" id="next" data-i18n="next"></button><span class="count"><span data-i18n="step"></span> <b id="sn">1</b> <span data-i18n="of"></span> 5</span></div>
</section>

<section id="economics" class="sec eco">
  <div class="head"><h2 data-i18n="eco_t"></h2><p data-i18n="eco_s"></p></div>
  <div class="eco-grid">
    <div class="panel inputs">
      <div class="sl"><label for="e1"><span data-i18n="e_price"></span><b id="v1"></b></label><input id="e1" type="range" min="500" max="20000" step="100" value="6400"></div>
      <div class="sl"><label for="e2"><span data-i18n="e_term"></span><b id="v2"></b></label><input id="e2" type="range" min="3" max="36" step="1" value="12"></div>
      <div class="sl"><label for="e3"><span data-i18n="e_rate"></span><b id="v3"></b></label><input id="e3" type="range" min="4" max="12" step="0.1" value="7.5"></div>
      <div class="sl"><label for="e4"><span data-i18n="e_fee"></span><b id="v4"></b></label><input id="e4" type="range" min="0" max="3" step="0.1" value="1.2"></div>
      <ul class="notes"><li data-i18n="e_n1"></li><li data-i18n="e_n2"></li><li data-i18n="e_n3"></li></ul>
    </div>
    <div class="panel out">
      <div class="big-fig"><span data-i18n="e_inst"></span><strong id="o_inst"></strong></div>
      <dl class="rows"><div><dt data-i18n="e_profit"></dt><dd id="o_profit"></dd></div><div><dt data-i18n="e_total"></dt><dd id="o_total"></dd></div><div><dt data-i18n="e_pool"></dt><dd id="o_pool"></dd></div></dl>
      <div class="pool" id="poolbar" role="img"></div>
      <div class="pool-l"><span><i class="sw c1"></i><span data-i18n="e_fb"></span> <b id="p1"></b></span><span><i class="sw c2"></i><span data-i18n="e_mb"></span> <b id="p2"></b></span><span><i class="sw c3"></i><span data-i18n="e_np"></span> <b id="p3"></b></span></div>
      <p class="fine" data-i18n="e_disc"></p>
    </div>
  </div>
</section>

      <label><span data-i18n="f_mail"></span><input name="m" type="email" autocomplete="email" required></label>
